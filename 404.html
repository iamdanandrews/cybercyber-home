<!doctype html><html lang="en"><head><meta charset="utf-8">

<title>404 — never issued — cyber:cyber</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%230B0B0D'/><circle cx='16' cy='11' r='2.7' fill='%23EA4E32'/><circle cx='16' cy='21' r='2.7' fill='%23EA4E32'/></svg>">
<style>
:root{--ground:#0B0B0D;--paper:#F2ECEF;--paper70:#C3BEC6;--accent:#EA4E32;--dim:#8C8996;
  --grey:#C9C4D1;--line:#211F27;--line2:#2C2A33;
  --mono:ui-monospace,'SF Mono',Menlo,monospace;--sans:'Helvetica Neue',Helvetica,Arial,sans-serif;
  --raveo:Raveo,'Helvetica Neue',sans-serif;--e1:cubic-bezier(.2,.7,.2,1);
  --t-cap:clamp(10px,.28vw + 9px,11.5px);--t-body:clamp(15px,.35vw + 13.6px,17px);
  --t-h2:clamp(46px,9vw,140px);}
@font-face{font-family:Raveo;src:url('RaveoVF.woff2') format('woff2');font-weight:100 900;font-display:block;}
*{margin:0;padding:0;box-sizing:border-box;}
::selection{background:var(--accent);color:var(--ground);}
html,body{height:100%;}
body{background:var(--ground);color:var(--paper);font-family:var(--sans);
  display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;}
.brand{position:absolute;top:22px;left:clamp(20px,5vw,64px);font-family:var(--mono);
  font-size:var(--t-cap);letter-spacing:.13em;color:var(--paper);text-decoration:none;}
.co{position:absolute;font-family:var(--mono);font-size:var(--t-cap);letter-spacing:.18em;
  color:var(--dim);text-transform:uppercase;}
.co.a{top:26px;right:clamp(20px,5vw,64px);}
.co.b{bottom:26px;left:clamp(20px,5vw,64px);}
main{text-align:center;padding:0 20px;}
h1{font-family:var(--raveo);font-variation-settings:"wght" 650,"opsz" 32;
  font-size:var(--t-h2);line-height:.9;letter-spacing:-.04em;}
h1 i{font-style:normal;color:var(--accent);}
/* the un-issued seal: the frame and the colon, but no field — nothing was ever
   generated for this address, so there is nothing to show */
.void-seal{width:clamp(120px,18vw,168px);margin:clamp(28px,5vh,46px) auto;display:block;}
.void-seal .fr{fill:none;stroke:var(--line2);stroke-width:1.4;stroke-dasharray:4 5;}
.void-seal .dot{fill:var(--dim);opacity:.55;}
.lede{font-size:var(--t-body);color:var(--paper70);max-width:34ch;margin:0 auto;line-height:1.7;}
.ref{font-family:var(--mono);font-size:var(--t-cap);letter-spacing:.3em;color:var(--dim);
  text-transform:uppercase;margin-top:14px;}
.home{display:inline-block;margin-top:clamp(26px,4vh,40px);font-family:var(--mono);
  font-size:var(--t-cap);letter-spacing:.18em;text-transform:uppercase;color:var(--paper);
  text-decoration:none;border-bottom:1px solid var(--line2);padding-bottom:4px;
  transition:border-color .2s var(--e1);}
.home:hover{border-color:var(--accent);}
@media(prefers-reduced-motion:reduce){.home{transition:none;}}
</style></head><body>
<a class="brand" href="./">cyber:cyber</a>
<span class="co a">51.5074&deg; N</span>
<span class="co b">00.1278&deg; W &middot; no fix</span>
<main>
  <h1>4<i>0</i>4</h1>
  <svg class="void-seal" viewBox="0 0 120 120" aria-hidden="true">
    <rect class="fr" x="6" y="6" width="108" height="108"/>
    <circle class="dot" cx="60" cy="52.4" r="4"/>
    <circle class="dot" cx="60" cy="67.6" r="4"/>
  </svg>
  <p class="lede">This page was never issued. No crest, no reference &mdash; nothing ships from here.</p>
  <p class="ref">Seal &middot; ------</p>
  <a class="home" href="./">&larr; Back to the lab</a>
</main>
</body></html>
